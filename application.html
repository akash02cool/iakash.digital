<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Apply | iAkash Digital</title>

<link rel="stylesheet" href="application.css">

</head>

<body>

<div class="application-container">

<h1>Join iAkash Digital</h1>
<p>Submit your application and our team will contact you.</p>

<form id="applyForm">

<input type="text" placeholder="Full Name" required>

<input type="email" placeholder="Email Address" required>

<input type="tel" placeholder="Phone Number" required>

<select required>
<option value="">Select Position</option>
<option>Digital Marketing Executive</option>
<option>Graphic Designer</option>
<option>Video Editor</option>
<option>UI/UX Designer</option>
<option>Social Media Manager</option>
</select>

<input type="file" required>

<textarea placeholder="Tell us about your experience"></textarea>

<button type="submit">Submit Application</button>

</form>

<div id="popup" class="popup">
Application Submitted Successfully!  
We will call you shortly.
</div>

</div>

<footer>

<p>©2026 iAkash.Digital</p>

</footer>

<script src="application.js"></script>

<!-- Vercel Web Analytics -->
<script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
<!-- End Vercel Web Analytics -->

</body>
</html>
